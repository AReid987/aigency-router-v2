# =============================================================================
# Docker Compose for Aigency Router Stack
#
# Services:
#   iii-engine — WebSocket orchestration hub (control plane)
#   sugar-db   — iii-sdk worker for telemetry and event logging
#   vault      — Encrypted API key management (iii worker)
#   gateway    — @aigency/gateway HTTP API
#   caddy      — Reverse proxy
#   backup     — Daily SQLite backup sidecar
# =============================================================================

volumes:
  sugar-db-data:
  caddy_data:
  caddy_config:
  backup-data:
  iii-state:
  iii-streams:
  vault-data:

services:
  # --------------------------------------------------------------------------
  # iii-engine — orchestration control plane (WebSocket+HTTP on :3000)
  # --------------------------------------------------------------------------
  iii-engine:
    build:
      context: .
      dockerfile: iii-engine/Dockerfile
    command: ["node", "--import", "tsx", "iii-engine/src/engine.ts"]
    working_dir: /app
    ports:
      - "3001:3000"
      - "3111:3111"
    volumes:
      - ./:/app
      - iii-state:/app/data/state
      - iii-streams:/app/data/streams
      - /app/node_modules
    environment:
      NODE_ENV: production
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SugarDB — backend data store
  # --------------------------------------------------------------------------
  sugar-db:
    build:
      context: .
      dockerfile: workers/sugar-db/Dockerfile
    depends_on:
      - iii-engine
    working_dir: /app
    ports:
      - "8081"
      - "3115:3115"
    volumes:
      - ./:/app
      - sugar-db-data:/app/data
      - /app/node_modules
    environment:
      III_URL: ws://iii-engine:3000
      SUGAR_DB_PATH: /app/data/sugar.db
      SSE_PORT: "3115"
      HEALTH_PORT: "8081"
      NODE_ENV: production
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Vault — encrypted API key management (iii worker)
  # --------------------------------------------------------------------------
  vault:
    build:
      context: .
      dockerfile: workers/vault/Dockerfile
    command: ["node", "--import", "tsx", "workers/vault/src/index.ts"]
    working_dir: /app
    depends_on:
      - iii-engine
    volumes:
      - ./:/app:ro
      - vault-data:/data
      - /app/node_modules
    environment:
      III_URL: ws://iii-engine:3000
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      VAULT_DB_PATH: /data/vault.db
      NODE_ENV: production
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Translator — model name to provider route resolution (iii worker)
  # --------------------------------------------------------------------------
  translator:
    build:
      context: .
      dockerfile: workers/translator/Dockerfile
    command: ["node", "--import", "tsx", "workers/translator/src/index.ts"]
    working_dir: /app
    depends_on:
      - iii-engine
    volumes:
      - ./:/app:ro
      - /app/node_modules
    environment:
      III_URL: ws://iii-engine:3000
      NODE_ENV: production
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Gateway — core HTTP API server
  # --------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: workers/gateway/Dockerfile
    command: ["node", "--import", "tsx", "workers/gateway/src/index.ts"]
    working_dir: /app
    ports:
      - "8080:8080"
    depends_on:
      - iii-engine
      - sugar-db
      - vault
    volumes:
      - ./:/app:ro
      - /app/node_modules
    environment:
      III_URL: ws://iii-engine:3000
      GATEWAY_SUGAR_DB_URL: http://sugar-db:8081
      GATEWAY_VAULT_URL: http://vault:8082
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-changeme}
      GATEWAY_RATE_LIMITING: false
      GATEWAY_ADMIN_AUTH: ${GATEWAY_ADMIN_AUTH:-false}
      GATEWAY_HEALTH_PORT: ${GATEWAY_HEALTH_PORT:-9090}
      GATEWAY_COST_REPORTING: ${GATEWAY_COST_REPORTING:-false}
      GATEWAY_DASHBOARD: ${GATEWAY_DASHBOARD:-false}
      PROVIDER_KEY_OPENROUTER: ${PROVIDER_KEY_OPENROUTER}
      PROVIDER_KEY_MISTRAL: ${PROVIDER_KEY_MISTRAL}
      PROVIDER_KEY_GROQ: ${PROVIDER_KEY_GROQ}
      PROVIDER_KEY_CEREBRAS: ${PROVIDER_KEY_CEREBRAS}
      PROVIDER_KEY_FREEMODEL: ${PROVIDER_KEY_FREEMODEL}
      PROVIDER_KEY_COMMAND_CODE: ${PROVIDER_KEY_COMMAND_CODE}
      PROVIDER_KEY_LLM7: ${PROVIDER_KEY_LLM7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Caddy — reverse proxy
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Backup — daily SQLite backup sidecar
  # --------------------------------------------------------------------------
  backup:
    image: node:22-alpine
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache sqlite >/dev/null 2>&1 || true
        while true; do
          echo "[backup] running daily backup at $$(date -Iseconds)"
          if [ -f /app/data/usage.db ]; then
            sqlite3 /app/data/usage.db ".backup /backups/usage-$$(date +%Y%m%d).db"
          else
            echo "[backup] no usage.db found, skipping"
          fi
          echo "[backup] sleeping 24h"
          sleep 86400
        done
    working_dir: /app
    volumes:
      - ./data:/app/data:ro
      - backup-data:/backups
    depends_on:
      - gateway
    restart: unless-stopped
